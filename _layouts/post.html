---
layout: default
---

<style>
  .post-meta {
    color: #586069;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .post-meta .date {
    margin-right: 1rem;
  }
  .post-meta .tags a {
    display: inline-block;
    background: #e1e4e8;
    color: #24292e;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-right: 0.3rem;
    text-decoration: none;
  }
  .post-meta .tags a:hover {
    background: #d1d5da;
  }
  .post-category {
    display: inline-block;
    background: #0366d6;
    color: #fff;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-size: 0.8rem;
    margin-right: 0.5rem;
  }
  .post-content {
    line-height: 1.8;
  }
  .post-content h1 { font-size: 1.8rem; margin-top: 2rem; }
  .post-content h2 { font-size: 1.5rem; margin-top: 1.8rem; }
  .post-content h3 { font-size: 1.25rem; margin-top: 1.5rem; }
  .post-content img { max-width: 100%; border-radius: 6px; }
  .post-content blockquote {
    border-left: 4px solid #0366d6;
    padding-left: 1rem;
    color: #586069;
    margin: 1rem 0;
  }
  .post-content code {
    background: #f6f8fa;
    padding: 0.2rem 0.4rem;
    border-radius: 3px;
    font-size: 0.9em;
  }
  .post-content pre {
    background: #f6f8fa;
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  .post-nav {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #e1e4e8;
    display: flex;
    justify-content: space-between;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: #0366d6;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
</style>

<a class="back-link" href="/blog.html">&larr; 返回博客列表</a>

<article>
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <span class="date">{{ page.date | date: "%Y-%m-%d" }}</span>
    {% if page.category %}
      <span class="post-category">{{ page.category }}</span>
    {% endif %}
    {% if page.tags.size > 0 %}
      <span class="tags">
        {% for tag in page.tags %}
          <a href="/tags.html#{{ tag }}">{{ tag }}</a>
        {% endfor %}
      </span>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>
</article>
